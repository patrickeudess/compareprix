name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # lundi : détecte les nouvelles vulnérabilités sans qu'aucun code n'ait changé
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Accessibilité du site statique (CSS et HTML, sans navigateur)
        run: python -W error::ResourceWarning -m unittest test_site_a11y -v
      - name: Lint (erreurs et pyflakes)
        run: ruff check .
      - name: Tests unitaires
        run: python -W error::ResourceWarning -m unittest test_pricing test_db test_unit_price test_security test_backup test_admin test_demo test_online_prices test_collaboration test_verification test_import_prices test_fiche_collecte -v

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # Échoue si une dépendance déclarée a une vulnérabilité connue
      - run: pip-audit -r requirements.txt

  docker:
    name: Image Docker (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t compareprix:ci .
      - name: Démarrage et sonde de santé
        run: |
          docker run -d --name cp -p 8000:8000 -e COMPAREPRIX_ADMIN_TOKEN=ci-token compareprix:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsSI http://127.0.0.1:8000/ | grep -i "content-security-policy"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/feedback)" = "401"
      - name: Journaux en cas d'échec
        if: failure()
        run: docker logs cp
